name: emaki Seedance trial

# FREE trial: uses Seedance 2 Mini, the only model emaki's free signup
# credits cover. Proves the whole pipeline (GitHub Action -> emaki -> clip)
# without spending anything.
#
# To try Seedance 2.5 later (needs the paid Starter plan, ~¥1,580/month),
# change `model:` below to seedance_2_5.

on:
  workflow_dispatch:

jobs:
  trial-clip:
    runs-on: ubuntu-latest
    steps:
      - name: Generate trial clip (Seedance 2 Mini, free credits)
        id: clip
        uses: hanshs474/emaki-action@v1
        with:
          api-key: ${{ secrets.EMAKI_API_KEY }}
          model: seedance_2_mini
          prompt: "Cinematic photorealistic dark fantasy: a sapphire-blue dragon spreads its wings on a stormy mountain ledge, rain and lightning behind it, slow camera push-in. No text."
          duration: "5"
          aspect-ratio: "16:9"
          resolution: "720p"
          parameters: '{"generate_audio": false}'
          output-path: assets/trial-clip.mp4

      - name: Show clip URL
        run: echo "${{ steps.clip.outputs.url }}"

      - name: Save clip as download
        uses: actions/upload-artifact@v4
        with:
          name: trial-clip
          path: assets/trial-clip.mp4
